[package]
name = "leaploader"
description = "LeapLoader's desktop app: puts your own Leapster 2 cartridge dumps on an SD card"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-or-later"

[[bin]]
name = "leaploader"
path = "src/main.rs"

# The same egui, wgpu and winit as Ribbit's desktop app (crates/ribbit-frontend),
# so the two look and behave alike. Cargo.lock started as a copy of Ribbit's.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
winit = "0.30"
wgpu = "30"
pollster = "1"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
rfd = "0.17"
# The frog icon: drawn from egui's own emoji font.
ab_glyph = "0.2.32"
epaint_default_fonts = "0.36.2"
# Display names: the CRC-32 of the dump (gamenames.rs).
crc32fast = "1.5"
# Zipped dumps (.zip with a .bin inside).
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The "card built" notification (notify.rs: a tray notification) and the
# Leapster 2 over USB (usb.rs: disks and their identity).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# SCSI commands to the Leapster 2 on Linux (usb.rs: SG_IO).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3"
# The .exe icon, drawn by src/frog_glyph.rs.
ab_glyph = "0.2.32"
epaint_default_fonts = "0.36.2"

[profile.release]
# A small app: no fat LTO (Ribbit's needs it for the emulator's hot loop).
codegen-units = 16
